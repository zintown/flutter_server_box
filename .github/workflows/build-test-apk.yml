name: Build Test APK

on:
  push:
    branches:
      - build/apk-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 0

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Fix the Android build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned APK
        shell: bash
        run: scripts/release/build-fdroid.sh arm64

      - name: Sign APK with debug key
        shell: bash
        run: |
          set -euo pipefail
          unsigned="build/app/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          signed="build/app/outputs/flutter-apk/ServerBox-arm64-test.apk"
          mkdir -p build/app/outputs/flutter-apk

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=ServerBox Debug,O=ServerBox,C=US"

          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$signed" \
            "$unsigned"

          "$APKSIGNER" verify "$signed"
          ls -lh "$signed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ServerBox-arm64-test-apk
          path: build/app/outputs/flutter-apk/ServerBox-arm64-test.apk
          retention-days: 7
